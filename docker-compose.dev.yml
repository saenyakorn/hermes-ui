services:
  hermes-agent-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=hermes_secret
      - PORT=3000
    volumes:
      - ./:/app
      - /app/node_modules
      - ./data:/app/data
